<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE SOCIAL CLUB — Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --green:#39ff14;
      --green-soft:#39ff1480;
      --bg:#030403;
      --panel:#080b08;
      --text:#fff;
      --muted:#8f9a8f;
      --red:#ff5555;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top, #123d0b 0%, #071007 28%, #020202 68%, #000 100%);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      padding:18px 14px;
    }

    .wrap{
      width:min(100%,520px);
      margin:0 auto;
    }

    .brand{
      text-align:center;
      font-size:30px;
      font-weight:900;
      letter-spacing:5px;
      color:var(--green);
      text-shadow:
        0 0 7px rgba(57,255,20,.95),
        0 0 18px rgba(57,255,20,.65),
        0 0 38px rgba(57,255,20,.35);
      margin:12px 0 5px;
    }

    .subtitle{
      text-align:center;
      color:#b8c4b8;
      font-size:12px;
      letter-spacing:2px;
      margin-bottom:18px;
    }

    .card{
      background:rgba(8,11,8,.97);
      border:1px solid rgba(57,255,20,.35);
      border-radius:18px;
      padding:18px;
      box-shadow:
        0 0 0 1px rgba(57,255,20,.05),
        0 12px 40px rgba(0,0,0,.55),
        0 0 30px rgba(57,255,20,.08);
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:14px;
      background:#000;
      border:1px solid rgba(57,255,20,.45);
      box-shadow:
        0 0 18px rgba(57,255,20,.12),
        inset 0 0 18px rgba(57,255,20,.04);
    }

    #reader video{
      border-radius:12px;
    }

    .message{
      margin-top:14px;
      padding:14px;
      border-radius:12px;
      background:#050705;
      border:1px solid #253025;
      text-align:center;
      color:#c7d0c7;
      font-size:14px;
      line-height:1.45;
    }

    .message.ok{
      border-color:var(--green);
      color:var(--green);
      box-shadow:0 0 16px rgba(57,255,20,.12);
    }

    .message.error{
      border-color:var(--red);
      color:#ff8888;
    }

    button{
      width:100%;
      margin-top:12px;
      padding:14px;
      border-radius:11px;
      border:1px solid var(--green);
      background:rgba(57,255,20,.10);
      color:var(--green);
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 0 12px rgba(57,255,20,.08);
    }

    button:hover{
      background:rgba(57,255,20,.18);
      box-shadow:0 0 18px rgba(57,255,20,.16);
    }

    .small{
      margin-top:12px;
      text-align:center;
      color:#667066;
      font-size:11px;
      line-height:1.5;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="brand">THE SOCIAL CLUB</div>
    <div class="subtitle">SCANNER QR · CONTROL DE ACCESO</div>

    <div class="card">

      <div id="reader"></div>

      <div id="message" class="message">
        Pulsa <strong>INICIAR CÁMARA</strong> y permite el acceso a la cámara.
      </div>

      <button id="startButton" type="button">
        INICIAR CÁMARA
      </button>

      <button id="stopButton" type="button" style="display:none;">
        DETENER CÁMARA
      </button>

      <div class="small">
        El QR debe contener un código como NOC-0001.
        Al leerlo, el código regresará automáticamente al sistema de control de acceso.
      </div>

    </div>
  </div>

  <script>
    const message = document.getElementById('message');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    const params = new URLSearchParams(window.location.search);
    const returnOrigin = params.get('returnOrigin');

    let scanner = null;
    let scanning = false;
    let sent = false;

    function showMessage(text, type) {
      message.className = 'message' + (type ? ' ' + type : '');
      message.innerHTML = text;
    }

    async function startCamera() {
      if (scanning) return;

      if (!window.isSecureContext) {
        showMessage(
          'La cámara requiere una conexión segura <strong>HTTPS</strong>.',
          'error'
        );
        return;
      }

      showMessage('Solicitando permiso para utilizar la cámara...');

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size =
                Math.floor(
                  Math.min(viewfinderWidth, viewfinderHeight) * 0.72
                );

              return {
                width: size,
                height: size
              };
            },
            aspectRatio: 1.0
          },
          function(decodedText) {
            handleCode(decodedText);
          },
          function() {}
        );

        scanning = true;
        startButton.style.display = 'none';
        stopButton.style.display = 'block';

        showMessage(
          '📷 Cámara activa.<br>Apunta al QR de la entrada.'
        );

      } catch (error) {
        console.error(error);

        showMessage(
          'No se pudo abrir la cámara.<br><br>' +
          'Verifica que estés usando HTTPS y que hayas permitido el acceso a la cámara.',
          'error'
        );
      }
    }

    async function stopCamera() {
      if (!scanner || !scanning) return;

      try {
        await scanner.stop();
      } catch (error) {
        console.error(error);
      }

      scanning = false;
      startButton.style.display = 'block';
      stopButton.style.display = 'none';

      showMessage('Cámara detenida.');
    }

    async function handleCode(decodedText) {
      if (sent) return;

      const text = String(decodedText || '')
        .trim()
        .toUpperCase();

      const match = text.match(/^NOC-\d{4,}$/);

      if (!match) {
        showMessage(
          'Se detectó un QR, pero no contiene un código válido de THE SOCIAL CLUB.',
          'error'
        );
        return;
      }

      sent = true;

      try {
        await scanner.stop();
      } catch (error) {}

      scanning = false;

      startButton.style.display = 'block';
      stopButton.style.display = 'none';

      showMessage(
        '✓ QR LEÍDO<br><strong style="font-size:22px;">' +
        match[0] +
        '</strong><br><br>Regresando al control de acceso...',
        'ok'
      );

      /*
       * Enviado al ADMIN que abrió esta ventana.
       * El ADMIN recibirá el código y ejecutará automáticamente
       * la validación contra Google Apps Script.
       */
      if (window.opener && returnOrigin) {
        try {
          window.opener.postMessage(
            {
              type: 'HE_SOCIAL_CLUB_QR',
              code: match[0]
            },
            returnOrigin
          );

          setTimeout(function() {
            window.close();
          }, 700);

          return;
        } catch (error) {
          console.error(error);
        }
      }

      showMessage(
        '✓ QR LEÍDO<br><strong style="font-size:22px;">' +
        match[0] +
        '</strong><br><br>' +
        'No se encontró la ventana del sistema que abrió este scanner.<br><br>' +
        '<span style="color:#aaa;font-size:12px;">Abre el escáner desde el botón de cámara dentro de ADMIN.</span>',
        'ok'
      );
    }

    startButton.addEventListener('click', startCamera);
    stopButton.addEventListener('click', stopCamera);
  </script>
</body>
</html>
